<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Send a Wish</title>
  <link rel="stylesheet" href="flag.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .form-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
    form{background:#fff;padding:18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);width:360px}
    form h2{margin-bottom:8px;color:#0b486b}
    label{display:block;font-weight:700;margin-top:10px}
    input[type="text"], textarea{width:100%;padding:8px;border-radius:6px;border:1px solid #ddd;font-size:1rem}
    textarea{min-height:100px;resize:vertical}
    .actions{display:flex;gap:8px;margin-top:12px}
    .actions button{flex:1;padding:10px;border-radius:6px;border:none;cursor:pointer}
    .actions .primary{background:#ff6b6b;color:#fff;font-weight:800}
    .actions .secondary{background:#2d98da;color:#fff}
    .result{margin-top:12px;background:#f7f9fc;padding:10px;border-radius:6px;font-size:.95rem;word-break:break-all}
    .social{display:inline-block;padding:8px 10px;border-radius:6px;color:#fff;text-decoration:none;font-weight:700;font-size:.95rem}
    .social.wht{background:#25D366}
    .social.fb{background:#1877F2}
    .social.tw{background:#1DA1F2}
    .social.tg{background:#2AABEE}
  </style>
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    <form id="shareForm" class="p-4 rounded shadow bg-white" style="max-width:420px;width:100%">
      <h2 class="mb-3">Send a wish</h2>
      <label for="fromName" class="form-label">Your name</label>
      <input id="fromName" name="name" type="text" placeholder="Your name" class="form-control" />

      <div class="form-check mt-3">
        <input id="showPhone" class="form-check-input" type="checkbox" />
        <label for="showPhone" class="form-check-label">Add phone (optional)</label>
      </div>
      <div id="phoneRow" style="display:none;">
        <label for="phoneNumber" class="form-label mt-2">Phone (include country code)</label>
        <input id="phoneNumber" name="phone" type="text" placeholder="e.g. 919876543210" class="form-control" />
      </div>

      <div class="d-grid gap-2 mt-3">
        <div class="d-flex gap-2">
          <button id="buildLink" type="button" class="btn btn-primary flex-fill">Create share link</button>
          <button id="openLink" type="button" class="btn btn-outline-primary">Open</button>
        </div>
        <div class="d-flex gap-2">
          <button id="directAccess" type="button" class="btn btn-secondary flex-fill">Direct Access</button>
          <button id="shareBtn" type="button" class="btn btn-outline-success">Share</button>
        </div>
      </div>

      <div id="preview" class="result mt-3" aria-live="polite">Live preview will appear here.</div>
      <div id="result" class="result mt-3" aria-live="polite">Shareable link will appear here.</div>
    </form>
  </div>

  <script>
    const buildBtn = document.getElementById('buildLink');
    const openBtn = document.getElementById('openLink');
    const directBtn = document.getElementById('directAccess');
    const shareBtn = document.getElementById('shareBtn');
    const showPhone = document.getElementById('showPhone');
    const phoneRow = document.getElementById('phoneRow');
    const phoneNumber = document.getElementById('phoneNumber');
    const result = document.getElementById('result');
    const fromName = document.getElementById('fromName');
    const wishText = document.getElementById('wishText');

    function makeLink(){
      const nameVal = (fromName.value||'').trim();
      if(!nameVal){ result.textContent = 'Please enter your name.'; return null; }
      const name = encodeURIComponent(nameVal);
      const href = `index1.html?name=${name}`;
      return href;
    }

    function updatePreview(){
      const n = fromName.value.trim();
      if(!n){ preview.textContent = 'Live preview will appear here.'; return; }
      const safeN = n ? n : 'Someone';
      preview.innerHTML = `<strong>Preview:</strong> <span style="font-weight:800">${safeN}</span>`;
    }

    fromName.addEventListener('input', updatePreview);

    buildBtn.addEventListener('click', ()=>{
      const href = makeLink();
      if(!href) return;
      const full = location.origin + location.pathname.replace(/wish.html$/,'') + href;

      // build WhatsApp href: prefer wa.me with phone if provided
      const phoneRaw = (phoneNumber && phoneNumber.value) ? (phoneNumber.value||'').trim().replace(/\D/g,'') : '';
      const nameVal = (fromName.value||'').trim();
      const msgText = `${nameVal? nameVal + ' sent you a wish — ' : ''}Happy Independence Day! Open: ${full}`;
      const encodedMsg = encodeURIComponent(msgText);
      const whatsappHref = (phoneRaw && phoneRaw.length>=7) ? `https://wa.me/${phoneRaw}?text=${encodedMsg}` : `https://api.whatsapp.com/send?text=${encodedMsg}`;

      result.innerHTML = `
        <a href="${href}" target="_blank" class="d-block mb-2">Open wish page</a>
        <small class="d-block mb-1">Or copy this link:</small>
        <div id="linkText" class="break-words">${full}</div>
        <button id="copyLink" class="btn btn-success mt-2">Copy link</button>
        <div id="socials" class="mt-3 d-flex gap-2 flex-wrap">
          <a class="social wht btn btn-sm d-inline-flex align-items-center" href="${whatsappHref}" target="_blank" rel="noopener"><i class="bi bi-whatsapp me-1"></i>WhatsApp</a>
          <a class="social fb btn btn-sm d-inline-flex align-items-center" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(full)}" target="_blank" rel="noopener"><i class="bi bi-facebook me-1"></i>Facebook</a>
          <a class="social tw btn btn-sm d-inline-flex align-items-center" href="https://twitter.com/intent/tweet?text=${encodeURIComponent('Happy Independence Day!')}&url=${encodeURIComponent(full)}" target="_blank" rel="noopener"><i class="bi bi-twitter me-1"></i>Twitter</a>
          <a class="social tg btn btn-sm d-inline-flex align-items-center" href="https://t.me/share/url?url=${encodeURIComponent(full)}&text=${encodeURIComponent('Happy Independence Day!')}" target="_blank" rel="noopener"><i class="bi bi-telegram me-1"></i>Telegram</a>
        </div>
      `;
      const copyBtn = document.getElementById('copyLink');
      if(copyBtn){ copyBtn.addEventListener('click', ()=>{
        const txt = document.getElementById('linkText').textContent;
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(()=>{ copyBtn.textContent = 'Copied' });
        } else {
          // fallback
          const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); copyBtn.textContent='Copied' }catch(e){} ta.remove();
        }
      })}
    });

    // toggle phone input visibility
    if(showPhone){
      showPhone.addEventListener('change', ()=>{
        if(showPhone.checked){
          phoneRow.style.display = 'block';
        } else {
          phoneRow.style.display = 'none';
          if(phoneNumber) phoneNumber.value = '';
        }
      });
    }

    // Share button: Web Share API with clipboard + mailto fallback
    if(shareBtn){
      shareBtn.addEventListener('click', async ()=>{
        const href = makeLink();
        if(!href) return;
        const base = location.origin + location.pathname.replace(/wish.html$/,'');
        const full = base + href;
        const nameVal = (fromName.value||'').trim();
        const title = 'Happy Independence Day';
        const text = nameVal ? `${nameVal} sent you a wish` : 'A wish for you';

        if(navigator.share){
          try{
            await navigator.share({title, text, url: full});
            result.textContent = 'Shared successfully.';
            return;
          }catch(e){ /* user cancelled or failed, fall back */ }
        }

        // Fallback: copy to clipboard and open mail client
        const copyAndNotify = async () => {
          try{
            if(navigator.clipboard && navigator.clipboard.writeText){
              await navigator.clipboard.writeText(full);
              result.textContent = 'Link copied to clipboard. You can paste it in any app or email.';
            } else {
              const ta = document.createElement('textarea'); ta.value = full; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); result.textContent='Link copied to clipboard.' }catch(e){ result.textContent='Copy failed. You can manually copy the link below.' } ta.remove();
            }
          }catch(e){ result.textContent='Copy failed.' }
        };

        await copyAndNotify();

        // Open mail client as an optional convenience
        const subject = encodeURIComponent(title);
        const body = encodeURIComponent(`${text}\n\nOpen this link:\n${full}`);
        window.location.href = `mailto:?subject=${subject}&body=${body}`;
      });
    }

    // Direct Access: open full URL in new tab and copy to clipboard
    if(directBtn){
      directBtn.addEventListener('click', async ()=>{
        const href = makeLink();
        if(!href) return;
        const base = location.origin + location.pathname.replace(/wish.html$/,'');
        const full = base + href;
        try{
          if(navigator.clipboard && navigator.clipboard.writeText){
            await navigator.clipboard.writeText(full);
            result.textContent = 'Direct link copied to clipboard and opened.';
          } else {
            const ta = document.createElement('textarea'); ta.value = full; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); result.textContent='Direct link copied to clipboard and opened.' }catch(e){ result.textContent='Opened link — copy failed.' } ta.remove();
          }
        }catch(e){ result.textContent = 'Copy failed, opening link only.' }
        window.open(full, '_blank');
      });
    }

    openBtn.addEventListener('click', ()=>{
      const href = makeLink();
      if(!href) return;
      window.open(href, '_blank');
    });

    // initialize preview
    updatePreview();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
